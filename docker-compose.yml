# Chroma server only. Apollo itself runs from the host (uv) so it can talk to
# Telegram long polling and local MCP clients without container networking games.
# Prefer `chroma run --path ./data/chroma --port 8000` from the uv venv so the
# server version matches the pinned `chromadb` (see uv.lock); this compose file is
# for convenience and should track that version.
services:
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: apollo-chroma
    ports:
      - "8000:8000"
    volumes:
      - ./data/chroma:/data
    command: ["run", "--path", "/data", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

