[project]
name = "apollo"
version = "0.1.0"
description = "Apollo — single-user, local-first personal agent platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Apollo" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pydantic-ai>=0.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "python-telegram-bot>=21.6",
    "httpx>=0.27",
    "typer>=0.12",
    "structlog>=24.1",
    "watchdog>=4.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
memory = [
    "mem0ai>=0.1.0",
    "chromadb>=0.5",
]
voice = [
    "faster-whisper>=1.0",
]
local-embeddings = [
    "fastembed>=0.4",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
apollo = "apollo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apollo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "eval: evaluation suites (may call a live model)",
    "integration: integration tests using a temp SQLite database",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
